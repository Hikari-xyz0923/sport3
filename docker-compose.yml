services:
  sports-buddy:
    build: .
    container_name: sports-buddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      SPORT_BUDDY_DATA_DIR: /data
      COOKIE_SECURE: "false"
    volumes:
      - sports-buddy-data:/data

volumes:
  sports-buddy-data:
